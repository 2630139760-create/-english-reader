<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7fb" />
    <meta
      name="description"
      content="英语语境阅读器——在安静、清晰的页面中专注阅读英文文章。"
    />
    <title>英语语境阅读器</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#" aria-label="英语语境阅读器首页">
        <span class="brand-mark" aria-hidden="true">E</span>
        <span>英语语境阅读器</span>
      </a>
      <p class="header-note">READ IN CONTEXT</p>
    </header>

    <main>
      <section id="editorView" class="editor-view" aria-labelledby="pageTitle">
        <div class="intro">
          <p class="eyebrow">YOUR READING SPACE</p>
          <h1 id="pageTitle">英语语境阅读器</h1>
          <p class="intro-copy">粘贴一篇英文文章，留出一段安静的时间，在语境中开始阅读。</p>
        </div>

        <form id="articleForm" class="editor-card" novalidate>
          <div class="field field-title">
            <label for="articleTitle">文章标题</label>
            <input
              id="articleTitle"
              name="articleTitle"
              type="text"
              placeholder="例如：The Joy of Reading"
              autocomplete="off"
              required
            />
            <p class="field-error" id="titleError" aria-live="polite"></p>
          </div>

          <div class="field">
            <div class="label-row">
              <label for="englishText">英文原文</label>
              <span>必填</span>
            </div>
            <textarea
              id="englishText"
              name="englishText"
              rows="11"
              placeholder="Paste your English article here..."
              spellcheck="true"
              required
            ></textarea>
            <p class="field-error" id="englishError" aria-live="polite"></p>
          </div>

          <div class="field">
            <div class="label-row">
              <label for="chineseText">中文全文翻译</label>
              <span>选填</span>
            </div>
            <textarea
              id="chineseText"
              name="chineseText"
              rows="7"
              placeholder="可以在这里粘贴中文翻译，阅读时按需展开。"
            ></textarea>
          </div>

          <div class="form-footer">
            <p><span class="save-dot" aria-hidden="true"></span>内容会自动保存在此设备</p>
            <button class="primary-button" type="submit">
              创建阅读
              <span aria-hidden="true">→</span>
            </button>
          </div>
        </form>
      </section>

      <section id="readerView" class="reader-view" aria-labelledby="readerTitle" hidden>
        <nav class="reader-nav" aria-label="阅读操作">
          <button id="backButton" class="back-button" type="button">
            <span aria-hidden="true">←</span>
            返回编辑
          </button>
          <div class="reader-actions">
            <span class="reading-label">专注阅读</span>
            <button
              id="vocabularyToggle"
              class="vocabulary-toggle"
              type="button"
              aria-expanded="false"
              aria-controls="vocabularyList"
            >
              生词表 <span id="vocabularyCount" class="vocabulary-count">0</span>
            </button>
          </div>
        </nav>

        <section id="vocabularyList" class="vocabulary-list" aria-label="当前文章生词表" hidden>
          <div class="vocabulary-list-header">
            <h2>当前文章的生词</h2>
            <span id="vocabularySummary">共 0 个</span>
          </div>
          <div id="vocabularyItems" class="vocabulary-items"></div>
          <p id="vocabularyEmpty" class="vocabulary-empty">点击文章中的英文单词，把它加入这里。</p>
        </section>

        <article class="article-card">
          <header class="article-header">
            <p class="eyebrow">ENGLISH ARTICLE</p>
            <h1 id="readerTitle"></h1>
            <div class="title-rule" aria-hidden="true"></div>
          </header>

          <div id="readerEnglish" class="article-body" lang="en"></div>

          <div id="translationSection" class="translation-section" hidden>
            <button
              id="translationToggle"
              class="translation-toggle"
              type="button"
              aria-expanded="false"
              aria-controls="readerTranslation"
            >
              <span id="translationToggleText">展开全文翻译</span>
              <span class="chevron" aria-hidden="true">⌄</span>
            </button>
            <div id="readerTranslation" class="translation-body" lang="zh-CN" hidden></div>
          </div>
        </article>
      </section>
    </main>

    <div id="wordCardBackdrop" class="word-card-backdrop" hidden></div>
    <aside
      id="wordCard"
      class="word-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="wordCardTitle"
      hidden
    >
      <div class="word-card-handle" aria-hidden="true"></div>
      <header class="word-card-header">
        <div>
          <p class="eyebrow">WORD CARD</p>
          <h2 id="wordCardTitle"></h2>
        </div>
        <button id="wordCardClose" class="icon-button" type="button" aria-label="关闭生词卡">×</button>
      </header>

      <form id="wordCardForm" class="word-card-form">
        <div class="field">
          <label for="wordMeaning">中文释义</label>
          <input id="wordMeaning" type="text" autocomplete="off" placeholder="输入中文释义" />
        </div>
        <div class="field">
          <label for="wordPhonetic">音标</label>
          <input id="wordPhonetic" type="text" autocomplete="off" placeholder="例如 /ˈriːdɪŋ/" />
        </div>
        <div class="field">
          <label for="wordExample">例句</label>
          <textarea id="wordExample" rows="4" placeholder="输入包含这个单词的例句"></textarea>
        </div>
        <p id="wordCardStatus" class="word-card-status" role="status" aria-live="polite"></p>
        <div class="word-card-actions">
          <button id="speakWord" class="secondary-button" type="button" aria-label="朗读当前英文单词">
            <span aria-hidden="true">◖</span> 朗读
          </button>
          <button id="wordCardSubmit" class="primary-button" type="submit">加入生词表</button>
        </div>
        <button id="deleteWord" class="delete-button" type="button">从生词表删除</button>
      </form>
    </aside>

    <footer>
      <p>Read slowly. Think deeply.</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
